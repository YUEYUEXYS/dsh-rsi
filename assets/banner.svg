      <stop offset="0" stop-color="#061311"/>
      <stop offset="0.55" stop-color="#0a1c18"/>
      <stop offset="1" stop-color="#07100e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
